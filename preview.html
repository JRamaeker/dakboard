<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dakboard (preview)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Portrait kitchen board. Rows add up to exactly 100vh.
   Sizes are in vh (the long side) and capped with vw where text runs horizontally,
   so nothing gets clipped on a tall, narrow screen. */
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:#080810; --surface:#10101c; --surface2:#181828; --border:#26263c;
  --nd-gold:#C99700; --nd-navy:#0C2340;
  --red:#ff1744; --green:#00e676;
  --cream:#f5f0e8; --muted:#8a8ab8; --dim:#4a4a6a; --text:#eeeeff;
  --fd:"Bebas Neue",sans-serif; --fb:"DM Sans",sans-serif; --fm:"Space Mono",monospace;

  --h-header:10vh; --h-fc:6vh; --h-cal:59vh; --h-agenda:15vh; --h-nd:6vh; --h-status:4vh;
}

html, body { width:100vw; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--fb); }
.dashboard { width:100vw; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.dashboard > * { flex-shrink:0; overflow:hidden; }

/* ── HEADER: clock | current weather ── */
.header { height:var(--h-header); display:flex; background:linear-gradient(135deg,#0C2340,#142a4a); border-bottom:3px solid var(--nd-gold); }
.clock-block { flex:1 1 44%; padding:0 3vw; display:flex; flex-direction:column; justify-content:center; min-width:0; }
.date-line { display:flex; gap:2vw; align-items:baseline; white-space:nowrap; }
.dayname { font-family:var(--fd); font-size:min(3vh,6vw); letter-spacing:3px; color:var(--nd-gold); line-height:1; }
.datefull { font-size:min(1.6vh,3.2vw); color:rgba(255,255,255,.6); letter-spacing:1px; text-transform:uppercase; }
.clock { font-family:var(--fd); font-size:min(6vh,13vw); line-height:1; color:#fff; white-space:nowrap; }
.clock .ampm { font-size:.4em; color:var(--nd-gold); margin-left:.4vw; letter-spacing:2px; }

.wx-now { flex:1 1 56%; padding:0 3vw 0 2vw; display:flex; align-items:center; justify-content:flex-end; gap:1.8vw; min-width:0; border-left:1px solid rgba(201,151,0,.35); }
.wx-icon { font-size:min(4.4vh,9vw); line-height:1; }
.wx-temp { font-family:var(--fd); font-size:min(6vh,12vw); color:var(--cream); line-height:1; white-space:nowrap; }
.wx-temp sup { font-size:.4em; vertical-align:top; }
.wx-meta { display:flex; flex-direction:column; gap:.4vh; min-width:0; flex-shrink:1; overflow:hidden; }
.wx-desc { font-size:min(1.7vh,3.4vw); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wx-hilo { font-family:var(--fm); font-size:min(1.5vh,3vw); color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wx-mini { font-size:min(1.3vh,2.6vw); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ── 5-DAY FORECAST (full width) ── */
.forecast { height:var(--h-fc); display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border-bottom:1px solid var(--border); }
.fc-day { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3vh; border-right:1px solid var(--border); white-space:nowrap; min-width:0; }
.fc-row { display:flex; align-items:center; gap:1.2vw; }
.fc-day:last-child { border-right:none; }
.fc-label { font-family:var(--fd); font-size:min(1.9vh,3.8vw); letter-spacing:2px; color:var(--muted); }
.fc-day.today .fc-label { color:var(--nd-gold); }
.fc-icon { font-size:min(2.4vh,4.8vw); }
.fc-temps { display:flex; align-items:baseline; gap:.8vw; line-height:1.1; }
.fc-hi { font-family:var(--fm); font-size:min(1.6vh,3.2vw); color:var(--cream); }
.fc-lo { font-family:var(--fm); font-size:min(1.2vh,2.4vw); color:var(--muted); }
.fc-precip { font-size:min(1.2vh,2.4vw); color:var(--muted); }

/* ── ND PANEL ── */
.nd-panel { height:var(--h-nd); background:linear-gradient(135deg,#0a1e38,#0C2340 60%,#0a1e38); border-top:1px solid rgba(201,151,0,.3); display:flex; align-items:center; padding:0 3vw; gap:3vw; }
.nd-logos { display:flex; align-items:center; gap:1.5vw; flex-shrink:0; }
.nd-logos img { height:3.8vh; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
.nd-vs { font-family:var(--fd); font-size:1.6vh; color:var(--muted); letter-spacing:2px; }
.nd-info { flex:1; min-width:0; }
.nd-matchup { font-family:var(--fd); font-size:min(2.2vh,4.4vw); letter-spacing:2px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nd-matchup em { color:var(--nd-gold); font-style:normal; }
.nd-details { font-size:min(1.3vh,2.6vw); color:rgba(255,255,255,.6); text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:.4vh; }
.nd-count { text-align:right; flex-shrink:0; }
.nd-count-label { font-size:1.1vh; letter-spacing:3px; color:var(--nd-gold); text-transform:uppercase; }
.nd-count-val { font-family:var(--fd); font-size:min(3.2vh,6.4vw); letter-spacing:2px; line-height:1; }
.nd-count-val.game-day { color:var(--nd-gold); }
.nd-score { display:flex; align-items:center; gap:2.5vw; flex:1; justify-content:center; }
.nd-score-num { font-family:var(--fd); font-size:4.2vh; line-height:1; }
.nd-score-num.win { color:var(--nd-gold); } .nd-score-num.lose { color:var(--muted); }
.nd-live { font-size:1.1vh; font-weight:700; letter-spacing:2px; color:var(--red); border:1px solid rgba(255,23,68,.5); border-radius:20px; padding:.3vh 1.2vw; }
.nd-status { font-family:var(--fd); font-size:2.6vh; color:var(--nd-gold); letter-spacing:2px; text-align:right; }

/* ── MONTH CALENDAR ── */
.cal { height:var(--h-cal); background:var(--surface); border-bottom:3px solid var(--nd-gold); display:flex; flex-direction:column; padding:.8vh 1.2vw .8vh; }
.cal-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:.6vh; }
.cal-month { font-family:var(--fd); font-size:min(3.6vh,7.2vw); letter-spacing:4px; line-height:1; }
.cal-month em { color:var(--nd-gold); font-style:normal; }
.cal-week { font-family:var(--fm); font-size:1.3vh; color:var(--muted); border:1px solid var(--border); padding:.3vh 1vw; border-radius:4px; }
.cal-dow-row, .cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; }
.cal-dow { text-align:center; font-size:min(1.3vh,2.6vw); letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:500; padding-bottom:.3vh; }
.cal-dow.today-col { color:var(--nd-gold); }
.cal-grid { flex:1; min-height:0; grid-auto-rows:minmax(0,1fr); }
.cal-day { background:var(--surface2); border-radius:6px; padding:.4vh .5vw; display:flex; flex-direction:column; gap:2px; min-height:0; overflow:hidden; }
.cal-day.other { background:transparent; }
.cal-day.other .day-num { color:var(--dim); }
.cal-day.past { opacity:.45; }
.cal-day.today { background:rgba(201,151,0,.16); outline:2px solid var(--nd-gold); outline-offset:-2px; }
.day-num { font-family:var(--fm); font-size:min(1.4vh,2.8vw); text-align:right; line-height:1.1; }
.day-num .mo { color:var(--nd-gold); margin-right:.4em; }
.cal-day.today .day-num { color:var(--nd-gold); font-weight:700; }
.pill { font-size:min(1.3vh,2.6vw); font-weight:600; line-height:1.25; padding:1px 4px; border-radius:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; border-left:3px solid; flex-shrink:0; }
.pill.wrap { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.pill .t { font-weight:400; opacity:.8; margin-right:3px; }
.more { font-size:min(1.15vh,2.3vw); color:var(--muted); padding-left:4px; }

/* ── AGENDA (next 5 days) ── */
.agenda { height:var(--h-agenda); background:var(--surface2); display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
.ag-col { border-right:1px solid var(--border); display:flex; flex-direction:column; min-width:0; min-height:0; }
.ag-col:last-child { border-right:none; }
.ag-head { padding:.5vh 1.5vw; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:1.2vw; }
.ag-head.today { background:linear-gradient(135deg,rgba(201,151,0,.2),transparent); border-bottom-color:var(--nd-gold); }
.ag-dow { font-family:var(--fd); font-size:min(1.9vh,3.8vw); letter-spacing:2px; color:var(--muted); }
.ag-num { font-family:var(--fd); font-size:min(2.6vh,5.2vw); line-height:1; }
.ag-head.today .ag-dow, .ag-head.today .ag-num { color:var(--nd-gold); }
.ag-events { flex:1; padding:.6vh 1.5vw; display:flex; flex-direction:column; gap:.5vh; overflow:hidden; min-height:0; }
.chip { display:flex; gap:.8vw; min-width:0; align-items:stretch; flex-shrink:0; }
.chip-bar { width:3px; border-radius:2px; flex-shrink:0; }
.chip-body { min-width:0; display:flex; align-items:baseline; gap:1vw; }
.chip-time { font-family:var(--fm); font-size:min(1.15vh,2.3vw); color:var(--muted); flex-shrink:0; min-width:5ch; }
.chip-title { font-size:min(1.4vh,2.8vw); font-weight:500; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.ag-more { font-size:min(1.1vh,2.2vw); color:var(--muted); }
.no-ev { font-size:min(1.2vh,2.4vw); color:var(--dim); font-style:italic; }

/* ── STATUS + LEGEND ── */
.status { height:var(--h-status); background:var(--nd-navy); border-top:3px solid var(--nd-gold); display:flex; align-items:center; justify-content:space-between; padding:0 3vw; gap:2vw; }
.legend { display:flex; gap:2vw; flex-wrap:nowrap; overflow:hidden; }
.legend span { display:flex; align-items:center; gap:.6vw; font-size:min(1.3vh,2.6vw); color:rgba(255,255,255,.8); white-space:nowrap; }
.legend i { width:1.1vh; height:1.1vh; border-radius:50%; display:inline-block; }
.updated { font-size:min(1.2vh,2.4vw); color:rgba(255,255,255,.55); white-space:nowrap; display:flex; align-items:center; gap:.8vw; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
.dot.err { background:var(--red); }
</style>
</head>
<body>
<div class="dashboard">

  <div class="header">
    <div class="clock-block">
      <div class="date-line"><div class="dayname" id="dayname">—</div><div class="datefull" id="datefull">—</div></div>
      <div class="clock"><span id="hhmm">--:--</span><span class="ampm" id="ampm"></span></div>
    </div>
    <div class="wx-now">
      <div class="wx-icon" id="wx-icon">⛅</div>
      <div class="wx-temp"><span id="wx-temp">--</span><sup>°</sup></div>
      <div class="wx-meta">
        <div class="wx-desc" id="wx-desc">—</div>
        <div class="wx-hilo" id="wx-hilo">↑--° ↓--°</div>
        <div class="wx-mini" id="wx-mini">💧--% · 💨-- mph</div>
      </div>
    </div>
  </div>

  <div class="forecast" id="forecast"></div>
  <div class="cal">
    <div class="cal-head"><div class="cal-month" id="cal-month">—</div><div class="cal-week" id="cal-week">WEEK --</div></div>
    <div class="cal-dow-row" id="cal-dow"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="agenda" id="agenda"></div>

  <div class="nd-panel" id="nd-panel"></div>

  <div class="status">
    <div class="legend" id="legend"></div>
    <div class="updated"><span style="color:var(--nd-gold);letter-spacing:2px">PREVIEW</span><span class="dot" id="sync-dot"></span><span id="updated">Loading…</span></div>
  </div>
</div>

<script>
// ── SETTINGS ──
const TZ = "America/New_York";            // South Bend is Eastern
const WX_LAT = 41.7052, WX_LON = -86.2354; // Notre Dame, IN
const GCAL_API_KEY = "AIzaSyDQeZzDXShJ0qi4bieN6V02lCvCzKqsGkI";

// name shows in the legend; order and colors match the old board
const CALENDARS = [
  { id:"d80f4844ae8c2f869f660d6e6078b0f184451702d45fbbd2f3a66692f80c1f50@group.calendar.google.com", name:"Addie",  color:"#ff3366" },
  { id:"jramaeker@gmail.com",                                                                       name:"Joey",   color:"#C99700" },
  { id:"a53339bf3b5e37f4057d8f4a42b90ef80e5cad84eae80fabc97eaffc0589ad02@group.calendar.google.com", name:"House",  color:"#7c3aed" },
  { id:"220e3efc2bf8ebcc0aa3969aa5d6917b7ddddabde6c1e5b01557dc9cf45253b7@group.calendar.google.com", name:"School", color:"#00b8d4" },
  { id:"c9a812107a0db75640adc93b84b0529027d096a869e96f14a4bdfeee9558c6f5@group.calendar.google.com", name:"Fia",    color:"#e6c700" },
  { id:"family11371226280449696764@group.calendar.google.com",                                       name:"Family", color:"#00c853" },
];

// Kickoffs carry their own UTC offset so the countdown is right in any timezone.
// tba:true = time not announced yet (shown as "Time TBA").
const ND_ID = "87";
const ND_SCHEDULE = [
  { kick:"2026-09-06T19:30:00-04:00", opp:"Wisconsin",      oppId:"275",  venue:"Lambeau Field",          net:"NBC",     note:"Shamrock Series" },
  { kick:"2026-09-12T15:30:00-04:00", opp:"Rice",           oppId:"242",  venue:"Notre Dame Stadium",     net:"NBC" },
  { kick:"2026-09-19T19:30:00-04:00", opp:"Michigan State", oppId:"127",  venue:"Notre Dame Stadium",     net:"NBC" },
  { kick:"2026-09-26T14:00:00-04:00", opp:"@ Purdue",       oppId:"2509", venue:"Ross-Ade Stadium",       net:"" },
  { kick:"2026-10-03T12:00:00-04:00", opp:"@ North Carolina",oppId:"153", venue:"Kenan Stadium",          net:"" },
  { kick:"2026-10-10T15:30:00-04:00", opp:"Stanford",       oppId:"24",   venue:"Notre Dame Stadium",     net:"NBC" },
  { kick:"2026-10-17T19:30:00-04:00", opp:"@ BYU",          oppId:"252",  venue:"LaVell Edwards Stadium", net:"ABC" },
  { kick:"2026-10-31T12:00:00-04:00", opp:"Navy",           oppId:"2426", venue:"Gillette Stadium",       net:"ABC/ESPN", note:"Shamrock Series" },
  { kick:"2026-11-07T19:30:00-05:00", opp:"Miami",          oppId:"2390", venue:"Notre Dame Stadium",     net:"NBC", tba:true },
  { kick:"2026-11-14T15:30:00-05:00", opp:"Boston College", oppId:"103",  venue:"Notre Dame Stadium",     net:"NBC", tba:true },
  { kick:"2026-11-21T19:30:00-05:00", opp:"SMU",            oppId:"2567", venue:"Notre Dame Stadium",     net:"NBC", tba:true },
  { kick:"2026-11-28T12:00:00-05:00", opp:"@ Syracuse",     oppId:"183",  venue:"JMA Wireless Dome",      net:"",    tba:true },
];

const WEEKS = 5;  // rows in the rolling calendar

// ── HELPERS ──
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad = n => String(n).padStart(2,"0");
// Local-date key (the old board used UTC, which pushed evening events to the next day)
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const shortTime = d => { let h=d.getHours(), m=d.getMinutes(), ap=h>=12?"p":"a"; h=h%12||12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ── CLOCK ──
function tick() {
  const now = new Date();
  let h = now.getHours();
  document.getElementById("ampm").textContent = h>=12 ? "PM" : "AM";
  h = h%12||12;
  document.getElementById("hhmm").textContent = `${h}:${pad(now.getMinutes())}`;
  document.getElementById("dayname").textContent = now.toLocaleDateString("en-US",{weekday:"long"}).toUpperCase();
  document.getElementById("datefull").textContent = now.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
}

// ── CALENDAR ──
let events = [];  // {key, start(Date|null), allDay, title, cal}
let lastDay = dayKey(new Date());

async function fetchCal(cal) {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()-now.getDay());  // Sunday of this week
  const end   = new Date(start.getFullYear(), start.getMonth(), start.getDate()+WEEKS*7); // through the last grid row
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events`
    + `?key=${GCAL_API_KEY}&timeMin=${start.toISOString()}&timeMax=${end.toISOString()}`
    + `&singleEvents=true&orderBy=startTime&maxResults=250&timeZone=${encodeURIComponent(TZ)}`;
  const data = await fetch(url).then(r => r.json());
  if (!data.items) throw new Error(`${cal.name}: ${data.error?.message || "no items"}`);
  const out = [];
  for (const it of data.items) {
    if (!it.start) continue;
    const title = it.summary || "(No title)";
    if (it.start.date) {                           // all-day, possibly multi-day
      const [y,m,d] = it.start.date.split("-").map(Number);
      const [y2,m2,d2] = it.end.date.split("-").map(Number);
      for (let cur = new Date(y,m-1,d), stop = new Date(y2,m2-1,d2); cur < stop; cur.setDate(cur.getDate()+1))
        out.push({ key:dayKey(cur), start:null, allDay:true, title, cal });
    } else {
      const s = new Date(it.start.dateTime);
      out.push({ key:dayKey(s), start:s, allDay:false, title, cal });
    }
  }
  return out;
}

async function loadCalendars() {
  const results = await Promise.allSettled(CALENDARS.map(fetchCal));
  const all = results.filter(r => r.status==="fulfilled").flatMap(r => r.value);
  const failed = results.filter(r => r.status==="rejected");
  failed.forEach(f => console.warn(f.reason));
  // Same event on several calendars (e.g. Family + Joey) shows once
  const seen = new Set();
  events = all.filter(e => { const k = `${e.key}|${e.title.toLowerCase()}|${e.start?.getTime() ?? "all"}`; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b) => a.key.localeCompare(b.key) || (a.allDay===b.allDay ? (a.start?.getTime()||0)-(b.start?.getTime()||0) : a.allDay ? -1 : 1));
  const dot = document.getElementById("sync-dot");
  dot.classList.toggle("err", failed.length > 0);
  document.getElementById("updated").textContent =
    (failed.length ? `${failed.length} calendar${failed.length>1?"s":""} failed · ` : "Synced ") +
    new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
}

function byDay() { const m = {}; events.forEach(e => (m[e.key] ||= []).push(e)); return m; }

function buildMonth() {
  const now = new Date(), todayKey = dayKey(now);
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()-now.getDay());
  const last  = new Date(start.getFullYear(), start.getMonth(), start.getDate()+WEEKS*7-1);
  const sameMo = start.getMonth()===last.getMonth();
  document.getElementById("cal-month").innerHTML = sameMo
    ? `${MONTHS[start.getMonth()].toUpperCase()} <em>${last.getFullYear()}</em>`
    : `${MONTHS[start.getMonth()].slice(0,3).toUpperCase()} – ${MONTHS[last.getMonth()].slice(0,3).toUpperCase()} <em>${last.getFullYear()}</em>`;
  const jan1 = new Date(now.getFullYear(),0,1);
  document.getElementById("cal-week").textContent = `WEEK ${Math.ceil(((now-jan1)/864e5 + jan1.getDay()+1)/7)}`;
  document.getElementById("cal-dow").innerHTML = DOW.map((d,i) => `<div class="cal-dow${i===now.getDay()?" today-col":""}">${d}</div>`).join("");

  const map = byDay(), grid = document.getElementById("cal-grid");
  grid.style.gridTemplateRows = `repeat(${WEEKS}, minmax(0,1fr))`;
  const LINES = 4;   // event lines that fit in one day cell
  let html = "";
  for (let i=0; i<WEEKS*7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i), key = dayKey(d);
    const cls = key===todayKey ? "today" : key<todayKey ? "past" : "";
    const mo = (d.getDate()===1 || i===0) ? `<span class="mo">${MONTHS[d.getMonth()].slice(0,3).toUpperCase()}</span>` : "";
    let inner = `<div class="day-num">${mo}${d.getDate()}</div>`;
    const evs = map[key] || [];
    // 1–2 events: let titles wrap to two lines. 3–4: one line each. 5+: three lines and "+N more".
    const shown = evs.length > LINES ? evs.slice(0,LINES-1) : evs;
    const wrap = evs.length <= LINES/2;
    shown.forEach(e => {
      inner += `<div class="pill${wrap?" wrap":""}" style="background:${e.cal.color}55;border-color:${e.cal.color}">${e.allDay?"":`<span class="t">${shortTime(e.start)}</span>`}${esc(e.title)}</div>`;
    });
    if (evs.length > shown.length) inner += `<div class="more">+${evs.length-shown.length} more</div>`;
    html += `<div class="cal-day ${cls}">${inner}</div>`;
  }
  grid.innerHTML = html;
}

function buildAgenda() {
  const now = new Date(), map = byDay();
  let html = "";
  for (let i=0; i<3; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i);
    const evs = (map[dayKey(d)] || []).filter(e => i>0 || e.allDay || e.start > new Date(now - 60*60*1000)); // today: drop events that ended over an hour ago
    const shown = evs.length > 4 ? evs.slice(0,3) : evs;
    const body = shown.length
      ? shown.map(e => `<div class="chip"><div class="chip-bar" style="background:${e.cal.color}"></div><div class="chip-body"><div class="chip-time">${e.allDay?"All day":shortTime(e.start)}</div><div class="chip-title">${esc(e.title)}</div></div></div>`).join("")
        + (evs.length>shown.length ? `<div class="ag-more">+${evs.length-shown.length} more</div>` : "")
      : `<div class="no-ev">Nothing scheduled</div>`;
    html += `<div class="ag-col"><div class="ag-head${i===0?" today":""}"><div class="ag-dow">${i===0?"TODAY":i===1?"TOMORROW":DOW[d.getDay()]}</div><div class="ag-num">${d.getDate()}</div></div><div class="ag-events">${body}</div></div>`;
  }
  document.getElementById("agenda").innerHTML = html;
}

function buildLegend() {
  document.getElementById("legend").innerHTML = CALENDARS.map(c => `<span><i style="background:${c.color}"></i>${c.name}</span>`).join("");
}

async function refreshCalendar() {
  try { await loadCalendars(); } catch(e) { console.error(e); }
  buildMonth(); buildAgenda();
}

// ── WEATHER ──
const WMO_ICON = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",56:"🌧️",57:"🌧️",61:"🌧️",63:"🌧️",65:"🌧️",66:"🌧️",67:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",77:"🌨️",80:"🌦️",81:"🌧️",82:"⛈️",85:"🌨️",86:"❄️",95:"⛈️",96:"⛈️",99:"⛈️"};
const WMO_DESC = {0:"Clear",1:"Mostly Clear",2:"Partly Cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light Drizzle",53:"Drizzle",55:"Heavy Drizzle",56:"Freezing Drizzle",57:"Freezing Drizzle",61:"Light Rain",63:"Rain",65:"Heavy Rain",66:"Freezing Rain",67:"Freezing Rain",71:"Light Snow",73:"Snow",75:"Heavy Snow",77:"Snow Grains",80:"Showers",81:"Showers",82:"Heavy Showers",85:"Snow Showers",86:"Heavy Snow Showers",95:"Thunderstorms",96:"T-Storms & Hail",99:"T-Storms & Hail"};

async function loadWeather(retries=3) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WX_LAT}&longitude=${WX_LON}`
      + `&current=temperature_2m,weather_code,wind_speed_10m`
      + `&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max`
      + `&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=5&timezone=${encodeURIComponent(TZ)}`;
    const r = await fetch(url); if (!r.ok) throw new Error("weather " + r.status);
    const { current:c, daily:d } = await r.json();
    document.getElementById("wx-temp").textContent = Math.round(c.temperature_2m);
    document.getElementById("wx-icon").textContent = WMO_ICON[c.weather_code] || "🌡️";
    document.getElementById("wx-desc").textContent = WMO_DESC[c.weather_code] || "—";
    document.getElementById("wx-hilo").textContent = `↑${Math.round(d.temperature_2m_max[0])}° ↓${Math.round(d.temperature_2m_min[0])}°`;
    document.getElementById("wx-mini").textContent = `💧${d.precipitation_probability_max[0] ?? 0}% · 💨${Math.round(c.wind_speed_10m)} mph`;
    document.getElementById("forecast").innerHTML = d.time.map((t,i) => {
      const day = new Date(t+"T12:00:00");
      return `<div class="fc-day${i===0?" today":""}"><div class="fc-row"><div class="fc-label">${i===0?"TODAY":DOW[day.getDay()]}</div><div class="fc-precip">💧${d.precipitation_probability_max[i] ?? 0}%</div></div><div class="fc-row"><div class="fc-icon">${WMO_ICON[d.weather_code[i]]||"🌡️"}</div><div class="fc-temps"><div class="fc-hi">${Math.round(d.temperature_2m_max[i])}°</div><div class="fc-lo">${Math.round(d.temperature_2m_min[i])}°</div></div></div></div>`;
    }).join("");
  } catch(e) {
    console.error(e);
    if (retries > 0) setTimeout(() => loadWeather(retries-1), 5000);
  }
}

// ── NOTRE DAME PANEL ──
const GAME_WINDOW = 4*60*60*1000;
const logo = id => `https://a.espncdn.com/i/teamlogos/ncaa/500/${id}.png`;
let live = null;   // last ESPN result during a game window

function nextGame() {
  const now = Date.now();
  for (const g of ND_SCHEDULE) { const k = new Date(g.kick); if (k.getTime()+GAME_WINDOW > now) return { ...g, k }; }
  return null;
}

function renderND() {
  const panel = document.getElementById("nd-panel"), g = nextGame();
  if (!g) { panel.innerHTML = `<div class="nd-info" style="text-align:center"><div class="nd-matchup">☘ SEASON COMPLETE · GO IRISH ☘</div></div>`; return; }
  const inWindow = Date.now() >= g.k.getTime();
  if (inWindow && live) {
    const ndWin = live.nd >= live.opp;
    panel.innerHTML = `${live.final ? "" : `<div class="nd-live">● LIVE</div>`}
      <div class="nd-score"><img src="${logo(ND_ID)}" style="height:3.8vh"><div class="nd-score-num ${ndWin?"win":"lose"}">${live.nd}</div>
      <div class="nd-score-num lose" style="opacity:.4">–</div><div class="nd-score-num ${ndWin?"lose":"win"}">${live.opp}</div><img src="${logo(g.oppId)}" style="height:3.8vh"></div>
      <div class="nd-status">${live.final ? "FINAL" : esc(live.status)}</div>`;
    return;
  }
  const diff = g.k - Date.now();
  let label = "KICKOFF IN", val, gameDay = false;
  if (diff <= 0) { label = "GAME TIME"; val = "KICKOFF!"; gameDay = true; }
  else {
    const dd = Math.floor(diff/864e5), hh = Math.floor(diff%864e5/36e5), mm = Math.floor(diff%36e5/6e4);
    val = dd > 0 ? `${dd}D ${pad(hh)}H ${pad(mm)}M` : `${pad(hh)}:${pad(mm)}:${pad(Math.floor(diff%6e4/1e3))}`;
    gameDay = dd === 0;
  }
  const when = g.k.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:TZ})
    + " · " + (g.tba ? "Time TBA" : g.k.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:TZ}) + " ET");
  const details = [when, g.net, g.venue].filter(Boolean).join(" · ");
  panel.innerHTML = `<div class="nd-logos"><img src="${logo(ND_ID)}" alt="Notre Dame"><div class="nd-vs">VS</div><img src="${logo(g.oppId)}" alt=""></div>
    <div class="nd-info"><div class="nd-matchup"><em>NOTRE DAME</em> ${g.opp.startsWith("@") ? "" : "VS "}${esc(g.opp.toUpperCase())}</div><div class="nd-details">${esc(details)}</div></div>
    <div class="nd-count"><div class="nd-count-label">${label}</div><div class="nd-count-val${gameDay?" game-day":""}">${g.tba && !gameDay ? `${Math.ceil(diff/864e5)} DAYS` : val}</div></div>`;
}

async function pollLive() {
  const g = nextGame();
  if (!g || Date.now() < g.k.getTime()) { live = null; return; }
  try {
    const ymd = g.k.toLocaleDateString("en-CA",{timeZone:TZ}).replace(/-/g,"");
    const data = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=${ymd}&groups=80&limit=300`).then(r => r.json());
    const ev = data.events?.find(e => e.competitions[0].competitors.some(c => c.team.id === ND_ID));
    if (!ev) return;
    const comp = ev.competitions[0], st = comp.status;
    const nd = comp.competitors.find(c => c.team.id === ND_ID), opp = comp.competitors.find(c => c.team.id !== ND_ID);
    live = { nd:+nd.score||0, opp:+opp.score||0, final:st.type.state==="post", status: st.type.state==="pre" ? "PREGAME" : `Q${st.period} ${st.displayClock}` };
  } catch(e) { console.warn("ESPN", e); }
}

// ── START ──
tick(); buildLegend(); renderND();
refreshCalendar(); loadWeather(); pollLive();
setInterval(() => {
  tick(); renderND();
  if (dayKey(new Date()) !== lastDay) { lastDay = dayKey(new Date()); refreshCalendar(); loadWeather(); } // roll over at midnight
}, 1000);
setInterval(refreshCalendar, 15*60*1000);
setInterval(loadWeather, 15*60*1000);
setInterval(pollLive, 30*1000);
</script>
